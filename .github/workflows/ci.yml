name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # The full known-answer sweep. Per-PR runs drop the `slow_kat`-tagged suites
  # (see .bazelrc.ci); this run puts them back, so an exhaustive sweep across
  # every parameter set runs daily rather than never.
  schedule:
    - cron: "0 17 * * *"

# Cancel in-progress runs for PRs (same head branch), but never cancel pushes
# to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Two legs, and both run on every pull request. The CPU leg is what checks the
# schemes against their published vectors; the GPU leg is what makes the fusion
# markers mean anything, because a marker that stops being recognized still
# produces the right bytes on CPU. Runners are labelled by capability, not by
# role — a CPU box is `[self-hosted, cpu]` and a GPU box is `[self-hosted, gpu]`
# — so each leg lands on a box that advertises what it needs.
#
# The matrix is static. Gating a leg on a repo variable would make it a check
# that never reports, which leaves a pull request pending forever rather than
# red; and a leg that only sometimes exists cannot become a required check.
# One GPU runner serves the whole org, so a leg that waits its turn is queued
# rather than missing — which is the honest signal.
jobs:
  build-and-test:
    # Explicit name; else GitHub appends every matrix value (incl. the long
    # --config=remote + cert-path flags) to the auto-generated job name.
    name: build-and-test (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU leg executes on the Buildbarn pool (`--config=remote`, see
          # //.bazelrc.rbe); the mTLS client material is machine-local, so the
          # paths point at the runner's own /etc/rbe-certs.
          - backend: cpu
            runs_on: [self-hosted, cpu]
            platforms: cpu
            flags: >-
              --config=remote
              --tls_certificate=/etc/rbe-certs/ca.pem
              --tls_client_certificate=/etc/rbe-certs/client.pem
              --tls_client_key=/etc/rbe-certs/client.key
          # The pool is CPU-only, so the GPU leg executes locally on the runner
          # and passes no remote flags. `cuda` is strict — no cpu fallback — so
          # a green leg really did run on the device. Preallocation is off
          # because bazel runs the test actions concurrently against that one
          # device, and each process would otherwise claim most of its memory.
          - backend: gpu
            runs_on: [self-hosted, gpu]
            platforms: cuda
            flags: --test_env=XLA_PYTHON_CLIENT_PREALLOCATE=false
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      # No setup-bazel: it clobbers the box's ~/.bazelrc (self-hosted runners
      # already persist bazel + caches). `.bazelrc.ci` is passed explicitly
      # because it is not auto-imported — it drops the tests CI's wheel can't
      # run and the slow sweeps a PR doesn't need.
      - name: Run bazel test
        env:
          # A CLI --test_tag_filters *replaces* .bazelrc.ci's rather than adding
          # to it, so the scheduled sweep has to restate the `local_only`
          # exclusion it still needs: those tests want the composite-capable dev
          # frxlib, which CI's published wheel is not. Empty on a pull request,
          # which leaves .bazelrc.ci's own default in force.
          TAG_FILTERS: ${{ github.event_name == 'schedule' && '--test_tag_filters=-local_only' || '' }}
        run: |
          set -euo pipefail
          bazel --bazelrc=.bazelrc.ci test ${{ matrix.flags }} ${TAG_FILTERS} \
            --test_env=FRX_PLATFORMS=${{ matrix.platforms }} -- //...

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the test output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main
        with:
          name: bazel-test-logs-${{ matrix.backend }}

  pre-commit:
    # The pin-bump PRs are authored by this account; their generated diffs are
    # already formatted and their subjects are not written to the convention.
    if: github.actor != 'fractalyze-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # --all-files rather than a diff range: the tree is small enough that the
      # whole-repo run is cheap, and it catches a violation that arrives in a
      # file the PR did not touch (a hook version bump, a new rule).
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
