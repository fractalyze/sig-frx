#
# Moves the hash-frx commit pin and the frx pin together. They are one pin, not
# two: hash-frx resolves frx from its own lock, so a lone bump puts two frx
# copies on one test's sys.path and fails as a dtype error, not a version
# conflict.
#
# That is why no separate frx-update workflow exists — bumping frx alone would
# open a PR that is red until hash-frx caught up.
#
# The schedule is what actually drives this. hash-frx publishes no wheel and
# dispatches nothing, so a poll is the only way to see it move, and "hash-frx
# moved" is the event that matters here — a fresh frx release changes nothing
# until hash-frx adopts it. The `frx-update` dispatch is kept as a cheap early
# wake-up for the case where hash-frx has already moved, and is inert until this
# repo joins the jax dispatcher's consumer list.
#
# The mechanism is shared with enc-frx, which pins hash-frx the same way; both
# call `fractalyze/github-actions/bzlmod-pin-sync`. What is left here is the
# triggers and which pins to move.

name: hash-frx Update

on:
  schedule:
    - cron: "0 16 * * *"
  repository_dispatch:
    types: [frx-update]
  workflow_dispatch:

concurrency:
  group: hash-frx-update
  cancel-in-progress: true

jobs:
  bump:
    # Self-hosted: both locks are refreshed with bazel, already on the box.
    runs-on: [self-hosted, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMPER_GH_PAT }}

      - uses: fractalyze/github-actions/bzlmod-pin-sync@main
        with:
          upstream_repo: hash-frx
          module_name: hash_frx
          paired_package: frx
          github_token: ${{ secrets.BUMPER_GH_PAT }}
