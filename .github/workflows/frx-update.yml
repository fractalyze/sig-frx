#
# Receives an `frx-update` repository_dispatch from the jax repo's
# notify-downstream workflow and opens a pin-bump PR. sig-frx must be on that
# dispatcher's consumer list for events to arrive.
#
# `upstream_repo: jax` below is not a leftover: pip-bump interpolates it into a
# github.com/fractalyze/<repo>/commit link, and the repo publishing these wheels
# is still named jax -- only the wheels are frx.
#
# The pin has to move in step with hash-frx's (see //requirements.in): hash-frx
# resolves frx from its own lock, and skew puts two different frx copies on one
# test's sys.path. A bump that lands here while hash-frx still pins the old
# build is what the dependency guard test fails on.

name: FRX Update

on:
  repository_dispatch:
    types: [frx-update]

concurrency:
  group: frx-update
  cancel-in-progress: true

jobs:
  bump:
    runs-on: [self-hosted, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMPER_GH_PAT }}

      - name: Bump frx/frxlib/frx-cuda12 plugins
        uses: fractalyze/github-actions/pip-bump@main
        with:
          upstream_repo: jax
          version: ${{ github.event.client_payload.frx_version }}
          upstream_commit: ${{ github.event.client_payload.commit }}
          packages: frx frxlib frx-cuda12-pjrt frx-cuda12-plugin
          github_token: ${{ secrets.BUMPER_GH_PAT }}
